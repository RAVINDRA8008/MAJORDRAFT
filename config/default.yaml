# ============================================================
# AMERS — Default Configuration
# ============================================================
# Override any key via CLI:  python scripts/train_full_pipeline.py seed=123

seed: 42
project_name: AMERS

# ------ Google Drive paths (Colab) ------
paths:
  drive_root: /content/drive/MyDrive/AMERS
  deap_raw: ${paths.drive_root}/data/deap/raw
  deap_processed: ${paths.drive_root}/data/deap/processed
  iemocap_raw: ${paths.drive_root}/data/iemocap/raw
  iemocap_processed: ${paths.drive_root}/data/iemocap/processed
  checkpoints: ${paths.drive_root}/checkpoints
  outputs: ${paths.drive_root}/outputs
  logs: ${paths.drive_root}/logs
  use_local_cache: false
  local_cache_dir: /content/local_cache

# ------ Data parameters ------
data:
  deap:
    sfreq: 128
    lowcut: 4.0
    highcut: 45.0
    epoch_sec: 1.0
    bands:
      - [4, 8]     # theta
      - [8, 12]    # alpha
      - [12, 16]   # low-beta
      - [16, 30]   # high-beta
      - [30, 45]   # gamma
    n_subjects: 32
    valence_threshold: 5.0
    arousal_threshold: 5.0

  iemocap:
    sr: 16000
    n_mfcc: 40
    max_len: 800
    pre_emphasis: 0.97
    n_sessions: 5
    target_emotions:
      - hap
      - exc
      - sad
      - ang
      - neu

# ------ Model architecture ------
model:
  num_classes: 4

  eeg_encoder:
    input_dim: 160           # 32 channels × 5 bands
    hidden_dims: [256, 128]
    embedding_dim: 128
    dropout: 0.3
    pretrain_epochs: 50      # increased for deeper v4 arch
    batch_size: 128
    lr: 0.001
    patience: 15             # increased patience
    max_samples_per_class: 5000   # cap majority classes
    min_samples_per_class: 2000   # oversample minority classes
    mixup: true                   # mixup augmentation
    mixup_alpha: 0.4              # mixup alpha
    n_attn_layers: 3              # transformer attention layers

  speech_encoder:
    n_mfcc: 120              # 40 × 3 (static + Δ + ΔΔ)
    cnn_channels: [32, 64, 128]
    lstm_hidden: 128
    lstm_layers: 2
    embedding_dim: 128
    dropout: 0.3
    pretrain_epochs: 30
    batch_size: 64
    lr: 0.001

  gan:
    feature_dim: 160
    noise_dim: 64
    hidden_dim: 256
    lr_g: 0.0001             # TTUR: G gets lower LR
    lr_d: 0.0002             # TTUR: D gets higher LR
    epochs: 100
    batch_size: 256
    gp_lambda: 10.0          # WGAN-GP gradient penalty coefficient
    n_critic: 5              # critic updates per generator update

  fusion:
    eeg_dim: 128
    speech_dim: 128
    hidden_dims: [128, 64]
    num_classes: 4
    dropout: 0.15             # reduced dropout (LayerNorm handles regularization)
    modality_dropout: 0.15     # modality dropout for robustness
    epochs: 50
    batch_size: 128
    lr: 0.001
    patience: 10             # early stopping patience
    focal_gamma: 2.0         # focal loss gamma for class imbalance

# ------ Reinforcement Learning ------
rl:
  obs_dim: 8
  max_ratio: 1.0
  max_steps: 50
  hidden_dim: 64
  lr_actor: 0.00006        # reduced 5× for stable fine-tuning
  lr_critic: 0.001
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  entropy_coeff: 0.01
  update_epochs: 4
  ppo_update_every: 3      # update every 3 steps for smoother learning
  min_ratio: 0.2            # lower bound on augmentation ratio
  max_ratio_bound: 0.6      # upper bound on augmentation ratio

# ------ Training ------
training:
  log_every: 5
  save_every: 10
  early_stop_patience: 15

# ============================================================
# v3 — Research-grade upgrade hyperparameters
# ============================================================
v3:
  # --- Contrastive pretraining (SimCLR / NT-Xent) ---
  contrastive:
    eeg_epochs: 100
    speech_epochs: 60
    batch_size: 512        # EEG (small samples)
    speech_batch_size: 64  # speech (large samples)
    lr: 0.0003
    temperature: 0.07      # NT-Xent temperature τ
    weight_decay: 0.0001

  # --- Domain adaptation (DANN) ---
  domain_adaptation:
    epochs: 30
    batch_size: 128
    lr: 0.0001
    domain_weight: 0.3     # λ_domain in total loss
    label_smoothing: 0.1

  # --- Transformer fusion ---
  transformer_fusion:
    n_tokens: 8            # split 128-dim → 8 tokens of 16
    d_model: 64
    n_heads: 4
    n_layers: 2
    ff_dim: 256
    epochs: 60
    batch_size: 128
    lr: 0.0005
    patience: 15

  # --- RL v2 (improved PPO) ---
  rl_v2:
    lr_actor: 0.00003
    entropy_coeff: 0.02
    fusion_lr: 0.0005
    warmup_epochs: 5       # warm-up fusion before RL starts

# ============================================================
# v5 — Cross-Modal Mutual Attention (CMMA) end-to-end v5.6
# ============================================================
v5:
  # --- CMMA architecture ---
  n_tokens: 8              # split 128-dim → 8 tokens of 16
  d_model: 128             # double v4 for richer representations
  n_heads: 4
  n_cmma_layers: 3         # bidirectional cross-attention layers
  ff_dim: 512
  dropout: 0.2             # v5.6: increased from 0.15 (reduce overfitting)
  modality_dropout: 0.05   # v5.1: reduced from 0.1 (was too aggressive)

  # --- End-to-end training ---
  epochs: 80
  batch_size: 64
  lr: 0.0003               # CMMA + classifier learning rate
  encoder_lr_factor: 0.05  # v5.1: more conservative (was 0.1)
  eag_lr_factor: 3.0       # v5.1: higher LR for EAG gate params
  weight_decay: 0.0005     # v5.6: increased from 0.0003 (reduce memorisation)
  warmup_epochs: 5         # linear LR warmup before cosine decay
  freeze_encoder_epochs: 8  # v5.1: freeze encoders for first N epochs
  patience: 20             # early stopping patience
  samples_per_epoch: 10000 # training samples per epoch
  grad_clip: 1.0           # gradient clipping max norm
  aux_loss_weight: 0.2     # v5.1: weight for auxiliary unimodal losses
  tf_anneal_epochs: 25     # v5.3: anneal teacher forcing 1.0→0.0 over N epochs
  gate_div_weight: 0.1     # v5.3: gate diversity regularizer weight
  ema_decay: 0.999         # v5.5: EMA decay (best-of-two validation)
  label_smoothing: 0.15    # v5.6: increased from 0.1 (softer targets)

# ------ Logging ------
logging:
  level: INFO
  tensorboard: true
